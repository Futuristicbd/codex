<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Commerce OS — order, courier, inventory, automation and analytics dashboard for online sellers." />
    <title>Commerce OS · Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div id="scrim" class="scrim"></div>

    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark">C</span>
        <div>
          <strong id="brand-name">Commerce OS</strong>
          <small>Business Manager</small>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <a href="../index.html" class="foot-link">← Back to site</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="search-box">
          <span>🔍</span>
          <input id="global-search" type="search" placeholder="Search orders by invoice, phone or name…" />
        </div>
        <div class="topbar-right">
          <label class="role-picker">
            <span>Role</span>
            <select id="role-switch">
              <option>Admin</option>
              <option>Moderator</option>
              <option>Support</option>
            </select>
          </label>
          <div class="avatar" title="Signed in">🧑‍💼</div>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
